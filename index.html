<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任乔洛 | 艺术总监</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Space+Grotesk:wght@300;500&display=swap" rel="stylesheet">
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030303; /* 极深灰背景 */
            color: #ffffff;
            font-family: 'Noto Serif SC', serif;
            overflow: hidden; /* 隐藏滚动条，保持单屏沉浸感 */
        }

        /* 画布背景层 */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.7;
        }

        /* 核心内容区 */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            /* 径向渐变，让视觉聚焦在中心文字 */
            background: radial-gradient(circle at center, transparent 0%, #030303 85%);
            pointer-events: none; /* 让鼠标事件穿透到画布（如果有交互的话） */
        }

        /* 标题动画与发光 */
        h1 {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: 0.8rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            animation: float 4s ease-in-out infinite;
        }

        /* 副标题（职位） */
        .subtitle {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            color: #888;
            letter-spacing: 0.5rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            animation: fadeIn 2s ease-out 0.5s both;
        }

        /* 动态分割线 */
        .divider {
            width: 40px;
            height: 1px;
            background: #555;
            margin: 0 auto 2.5rem;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            animation: expand 1.5s ease-out 1s both;
        }

        /* 个人简介简语 */
        .description {
            color: #777;
            font-size: 1.1rem;
            letter-spacing: 0.1rem;
            margin-bottom: 3.5rem;
            animation: fadeIn 2s ease-out 1.5s both;
        }
